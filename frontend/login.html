<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Pastebin - Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 50px 15px;
        }

        .container {
            background-color: white;
            padding: 30px;
            max-width: 350px;
            margin: auto;
            border-radius: 10px;
        }

        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
        }

        button {
            background-color: #2196f3;
            color: white;
            border: none;
            cursor: pointer;
        }

        #status {
            color: red;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>WebSocket Pastebin</h2>
        <h3>Login</h3>

        <form id="loginInputForm">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>

            <button type="submit">Log in</button>
        </form>

        <p id="status"></p>
    </div>

    <script>
        // Login using Authentication API
        document.getElementById('loginInputForm').addEventListener('submit', async (event) => {
            event.preventDefault()

            const email = document.getElementById('email').value
            const password = document.getElementById('password').value

            try {
                const response = await fetch(
                    'https://virtual-board-authentication.onrender.com/users/login',
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        //body: JSON.stringify({ email, password })
                        // Request a 15-minute access token for WebSocket Pastebin
                        body: JSON.stringify({ email, password, project: 'pastebin' })
                    }
                )

                if (!response.ok) {
                    throw new Error('Invalid email or password!')
                }

                const data = await response.json()

                if (!data.jwt) {
                    throw new Error('JWT not received!')
                }

                // Save JWT in LocalStorage
                localStorage.setItem('jwt', data.jwt)
                // Del3 save refresh token for automatic JWT renewal
                localStorage.setItem('refresh_token', data.refresh_token)

                // Redirect to index.html after successful login
                window.location.href = 'index.html'

            } catch (error) {
                document.getElementById('status').textContent = error.message
            }
        })
    </script>

</body>
</html>
